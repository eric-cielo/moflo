name: File-sync smoke (#976)

# Issue #976: cross-platform validation for the postinstall bootstrap +
# session-start launcher's file-sync layer. The matrix covers the three
# supported runtime hosts:
#
#   ubuntu-latest  — Linux native (ext4 rename behavior)
#   macos-latest   — APFS clone + rename semantics
#   windows-latest — NTFS file locks, AV real-time scan, Windows file
#                    sharing modes (the dominant failure class for #854/#975)
#
# Tests exercised on every leg:
#   - file-sync-helper.test.ts        — atomicCopy, hash-skip, EVERIFY,
#                                       circuit breaker, .tmp breadcrumb
#   - post-install-bootstrap.test.ts  — bootstrap end-to-end including
#                                       sentinel write + hash-skip mtime
#   - bootstrap-sentinel-promotion.test.ts — launcher §0/§3h sentinel +
#                                            upgrade-notice round-trip
#   - daemon-service.test.ts          — OS-native service registration
#                                       (#1412). Not a file-sync test; it rides
#                                       this matrix because it is the repo's
#                                       only 3-OS vitest leg and the suite is
#                                       where separator-flavor bugs hide. The
#                                       Linux branch derived its systemd unit
#                                       name with `split('/')`, which returns
#                                       the WHOLE path under NTFS — invisible
#                                       to the ubuntu-only `Tests` job. Now the
#                                       macOS/Linux/Windows branches are all
#                                       stub-driven, so every leg asserts every
#                                       branch in ~2s.
#
# These three together cover the six #976 acceptance behaviors:
#   B1 hash-skip preserves mtime
#   B2 no .tmp stragglers on success
#   B3 .tmp breadcrumb on rename failure
#   B4 EVERIFY on truncated tmp + retry recovery
#   B5 sentinel write/read/clear
#   B6 upgrade-notice round-trip (in-progress → completed)

on:
  # Deliberately NOT path-filtered on pull_request.
  #
  # These three jobs are required status checks on `main`. A required context
  # that never reports does not "pass by default" — GitHub waits for it
  # indefinitely, so a path filter here blocks every PR that does not touch a
  # listed file. That is exactly what happened once the contexts were made
  # required: PR #1356 went 9/9 green and still sat at BLOCKED.
  #
  # The alternative — a mirrored skip-workflow with inverse `paths-ignore`
  # posting identically-named jobs — keeps the filter but splits the job names
  # across two files that must never drift, and a drift there silently stops
  # the gate enforcing anything. Running for real is the cheaper guarantee:
  # measured at 69s (windows) / 37s (ubuntu) / 29s (macos), all comfortably
  # inside the CI `Tests` job, so this adds no wall-clock to a PR.
  #
  # The `push` trigger below keeps its filter — nothing gates on those runs.
  pull_request:
    branches: [main, 'epic/*']
  push:
    branches: [main, 'epic/*']
    paths:
      - 'bin/lib/file-sync.mjs'
      - 'bin/lib/shipped-scripts.mjs'
      - 'bin/lib/shipped-scripts.json'
      - 'bin/session-start-launcher.mjs'
      - 'scripts/post-install-bootstrap.mjs'
      - 'src/cli/__tests__/file-sync-helper.test.ts'
      - 'src/cli/__tests__/post-install-bootstrap.test.ts'
      - 'src/cli/__tests__/bootstrap-sentinel-promotion.test.ts'
      - 'src/cli/__tests__/shipped-scripts-manifest.test.ts'
      - 'src/cli/services/daemon-service.ts'
      - 'src/cli/__tests__/services/daemon-service.test.ts'
      - '.github/workflows/file-sync-smoke.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '22'

# Don't cancel in-flight pushes to main — partial validation leaves the
# branch in an unverified state. PR runs are cancellable.
concurrency:
  group: file-sync-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Native: NTFS / APFS / ext4 each have their own lock + rename semantics.
  # Bug #975's failure venue was DrvFs (covered separately below) but the
  # other native filesystems have caught a long tail of platform-specific
  # rename behavior, so we run all three on every change.
  #
  # #1175 trimmed this to ubuntu-only on cost grounds and moved cross-OS
  # coverage to publish time; restored here because moflo's change rate has
  # slowed, so the per-PR runner multiplier applies to far fewer runs while
  # the cost of finding a rename-semantics bug only at publish stayed high.
  # These legs are cheap in wall-clock terms — windows runs ~1m07s, well
  # inside the CI `Tests` job, so they do not extend the critical path.
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (tsc only — tests need the source helpers under bin/lib/)
        run: npm run build

      # `--config vitest.isolation.config.ts` is load-bearing, not a tuning knob.
      # The default config splices `isolationTests` into `exclude`, and vitest's
      # exclude wins over an explicitly named file — so under the default config
      # this step silently ran 4 of the 6 files below (bootstrap-sentinel-promotion
      # and launcher-854-fixes are both on that list) and still exited 0. B5/B6
      # went uncovered on every platform while the check reported green. The
      # isolation config carries no test exclude, which is exactly what an
      # explicit-file leg needs.
      - name: Run file-sync smoke tests
        run: npx vitest run --config vitest.isolation.config.ts --reporter=default
          src/cli/__tests__/file-sync-helper.test.ts
          src/cli/__tests__/post-install-bootstrap.test.ts
          src/cli/__tests__/bootstrap-sentinel-promotion.test.ts
          src/cli/__tests__/shipped-scripts-manifest.test.ts
          src/cli/__tests__/services/daemon-service.test.ts
          tests/bin/launcher-854-fixes.test.ts
